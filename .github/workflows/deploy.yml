name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing.
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: train-website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: train-website/package-lock.json

      - run: npm ci

      # The reduced-motion contract in §11 is part of the Definition of Done,
      # so a regression should fail the deploy rather than ship.
      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build
        env:
          # Switches next.config.ts to output: 'export' with the /Train
          # basePath and unoptimised images. See that file for why.
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: train-website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
